<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sketch to Art</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            position: relative;
        }

        #drawCanvas {
            position: absolute;
            top: 0; left: 0;
            touch-action: none;
            cursor: crosshair;
            z-index: 2;
        }

        #aiCanvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #aiCanvas.visible {
            opacity: 0.85;
        }

        .status-indicator {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: #aaa;
            pointer-events: none;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #444;
        }
        .dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .dot.generating { background: #f59e0b; animation: pulse 0.8s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .clear-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            color: #888;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .clear-btn:hover { background: rgba(220,38,38,0.3); color: #fff; }

        .undo-btn {
            position: fixed;
            bottom: 20px;
            right: 80px;
            z-index: 100;
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            color: #888;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .undo-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    </style>
</head>
<body>
    <canvas id="aiCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>

    <div class="status-indicator">
        <div class="dot" id="dot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <button class="undo-btn" id="undoBtn">↩</button>
    <button class="clear-btn" id="clearBtn">✕</button>

    <script>
        const drawCanvas = document.getElementById('drawCanvas');
        const aiCanvas = document.getElementById('aiCanvas');
        const ctx = drawCanvas.getContext('2d', { willReadFrequently: true });
        const actx = aiCanvas.getContext('2d');

        let ws = null;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let autoTimer = null;
        let isGenerating = false;
        let strokeHistory = [];
        let hasStrokes = false;

        // Fixed square canvas — consistent aspect ratio between phone and viewer
        const CANVAS_SIZE = 1024;
        drawCanvas.width = CANVAS_SIZE;
        drawCanvas.height = CANVAS_SIZE;
        aiCanvas.width = CANVAS_SIZE;
        aiCanvas.height = CANVAS_SIZE;

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        // Zoom & pan state
        let scale = 1;
        let offsetX = 0, offsetY = 0;

        function getBaseScale() {
            // Fill the screen (cover), not fit inside it
            return Math.max(window.innerWidth, window.innerHeight) / CANVAS_SIZE;
        }

        function applyTransform() {
            const s = getBaseScale() * scale;
            const cx = (window.innerWidth - CANVAS_SIZE * s) / 2 + offsetX;
            const cy = (window.innerHeight - CANVAS_SIZE * s) / 2 + offsetY;
            const transform = `translate(${cx}px, ${cy}px) scale(${s})`;
            drawCanvas.style.transform = transform;
            aiCanvas.style.transform = transform;
            drawCanvas.style.transformOrigin = '0 0';
            aiCanvas.style.transformOrigin = '0 0';
        }
        applyTransform();
        window.addEventListener('resize', applyTransform);

        // --- Zoom controls ---
        // Scroll wheel on desktop
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.max(0.3, Math.min(5, scale * delta));
            applyTransform();
        }, { passive: false });

        // Pinch-to-zoom on phone (two fingers)
        let lastPinchDist = 0;
        let isPinching = false;
        drawCanvas.addEventListener('pointerdown', (e) => {
            // Track multi-touch for pinch
        });
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isPinching = true;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && isPinching) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const delta = dist / lastPinchDist;
                scale = Math.max(0.3, Math.min(5, scale * delta));
                lastPinchDist = dist;
                applyTransform();
            }
        }, { passive: false });
        document.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) isPinching = false;
        });

        // --- Drawing ---
        function getPos(e) {
            // Convert screen coords to canvas coords accounting for CSS transform
            const s = getBaseScale() * scale;
            const cx = (window.innerWidth - CANVAS_SIZE * s) / 2 + offsetX;
            const cy = (window.innerHeight - CANVAS_SIZE * s) / 2 + offsetY;
            return {
                x: (e.clientX - cx) / s,
                y: (e.clientY - cy) / s,
                pressure: e.pressure || 0.5
            };
        }

        function startDraw(e) {
            e.preventDefault();
            if (isPinching) return;
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;

            // Save state for undo
            strokeHistory.push(ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
            if (strokeHistory.length > 50) strokeHistory.shift();

            // Hide AI overlay while drawing
            aiCanvas.classList.remove('visible');

            if (autoTimer) clearTimeout(autoTimer);
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing) return;

            const pos = getPos(e);
            const pressure = pos.pressure;
            const size = 3 + pressure * 5;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Send stroke to viewer in real-time (normalized 0-1 on square canvas)
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'stroke',
                    x1: lastX / CANVAS_SIZE,
                    y1: lastY / CANVAS_SIZE,
                    x2: pos.x / CANVAS_SIZE,
                    y2: pos.y / CANVAS_SIZE,
                    size: size / CANVAS_SIZE,
                }));
            }

            lastX = pos.x;
            lastY = pos.y;
            hasStrokes = true;
        }

        function endDraw(e) {
            if (e) e.preventDefault();
            if (!isDrawing) return;
            isDrawing = false;

            // Send full canvas snapshot to keep viewer synced
            sendCanvasSync();

            // Auto-send to AI after 2s of no drawing
            if (autoTimer) clearTimeout(autoTimer);
            if (hasStrokes) {
                autoTimer = setTimeout(requestGenerate, 2000);
            }
        }

        function sendCanvasSync() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            drawCanvas.toBlob((blob) => {
                const reader = new FileReader();
                reader.onload = () => {
                    ws.send(JSON.stringify({
                        type: 'sync',
                        canvas: reader.result.split(',')[1],
                    }));
                };
                reader.readAsDataURL(blob);
            }, 'image/jpeg', 0.7);
        }

        drawCanvas.addEventListener('pointerdown', startDraw);
        drawCanvas.addEventListener('pointermove', draw);
        drawCanvas.addEventListener('pointerup', endDraw);
        drawCanvas.addEventListener('pointerleave', endDraw);
        drawCanvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
        drawCanvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        // --- Clear & Undo ---
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
            actx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);
            aiCanvas.classList.remove('visible');
            strokeHistory = [];
            hasStrokes = false;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'clear' }));
            }
        });

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (strokeHistory.length > 0) {
                ctx.putImageData(strokeHistory.pop(), 0, 0);
                aiCanvas.classList.remove('visible');
                sendCanvasSync();
            }
        });

        // --- WebSocket ---
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                document.getElementById('dot').className = 'dot connected';
                document.getElementById('statusText').textContent = 'Ready';
            };
            ws.onclose = () => {
                document.getElementById('dot').className = 'dot';
                document.getElementById('statusText').textContent = 'Reconnecting...';
                setTimeout(connectWS, 3000);
            };
            ws.onerror = () => ws.close();

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'result' && data.image) {
                    showAIResult(data.image, data.time);
                    isGenerating = false;
                    document.getElementById('dot').className = 'dot connected';
                    document.getElementById('statusText').textContent = `${data.time}s`;
                }
            };
        }

        function requestGenerate() {
            if (!ws || ws.readyState !== WebSocket.OPEN || isGenerating) return;

            isGenerating = true;
            document.getElementById('dot').className = 'dot generating';
            document.getElementById('statusText').textContent = 'Thinking...';

            drawCanvas.toBlob((blob) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const b64 = reader.result.split(',')[1];
                    ws.send(JSON.stringify({
                        type: 'generate',
                        sketch: b64,
                        prompt: '__auto__',
                        strength: 0.65,
                    }));
                };
                reader.readAsDataURL(blob);
            }, 'image/png');
        }

        function showAIResult(imageB64, time) {
            const img = new Image();
            img.onload = () => {
                actx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);
                actx.drawImage(img, 0, 0, aiCanvas.width, aiCanvas.height);
                aiCanvas.classList.add('visible');
            };
            img.src = 'data:image/webp;base64,' + imageB64;
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); document.getElementById('undoBtn').click(); }
        });

        connectWS();
    </script>
</body>
</html>
