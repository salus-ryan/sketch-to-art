<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #111;
            overflow: hidden;
            height: 100%;
            width: 100%;
            touch-action: none;
        }
        #c {
            position: absolute;
            background: #fff;
            touch-action: none;
            cursor: crosshair;
        }
        .dot {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #333;
            z-index: 99;
        }
        .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .btn {
            position: fixed;
            bottom: 16px;
            z-index: 99;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:active { background: rgba(255,255,255,0.2); }
        #undoBtn { right: 70px; }
        #clearBtn { right: 16px; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="dot" id="dot"></div>
    <button class="btn" id="undoBtn">↩</button>
    <button class="btn" id="clearBtn">✕</button>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const dot = document.getElementById('dot');

        // --- Fixed 1024x1024 internal resolution ---
        const SIZE = 1024;
        canvas.width = SIZE;
        canvas.height = SIZE;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, SIZE, SIZE);

        // --- Fit canvas to screen (cover mode) ---
        function fitCanvas() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            // Scale to cover viewport
            const s = Math.max(vw / SIZE, vh / SIZE) * scale;
            const left = (vw - SIZE * s) / 2 + panX;
            const top = (vh - SIZE * s) / 2 + panY;
            canvas.style.transform = `translate(${left}px, ${top}px) scale(${s})`;
            canvas.style.transformOrigin = '0 0';
        }

        let scale = 1, panX = 0, panY = 0;
        fitCanvas();
        window.addEventListener('resize', fitCanvas);

        // --- Coordinate conversion ---
        function screenToCanvas(clientX, clientY) {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const s = Math.max(vw / SIZE, vh / SIZE) * scale;
            const left = (vw - SIZE * s) / 2 + panX;
            const top = (vh - SIZE * s) / 2 + panY;
            return { x: (clientX - left) / s, y: (clientY - top) / s };
        }

        // --- WebSocket ---
        let ws = null;
        let strokeBuf = [];
        let flushTimer = null;

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => {
                dot.classList.add('ok');
                flushStrokes();
                // Send current canvas state so server + viewers are in sync
                sendSync();
            };
            ws.onclose = () => { dot.classList.remove('ok'); setTimeout(connect, 2000); };
            ws.onerror = () => ws.close();
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'request_sync') {
                    sendSync();
                }
            };
        }
        connect();

        function send(msg) {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
        }

        function sendSync() {
            send({ type: 'sync', canvas: canvas.toDataURL('image/jpeg', 0.6).split(',')[1] });
        }

        function bufferStroke(x1, y1, x2, y2, w) {
            strokeBuf.push({ x1, y1, x2, y2, w });
            if (!flushTimer) {
                flushTimer = requestAnimationFrame(flushStrokes);
            }
        }

        function flushStrokes() {
            flushTimer = null;
            if (strokeBuf.length === 0) return;
            send({ type: 'strokes', data: strokeBuf });
            strokeBuf = [];
        }

        // --- Drawing state ---
        let drawing = false;
        let lx = 0, ly = 0;
        let history = [];
        let pinching = false;
        let pinchDist = 0;

        // --- Pointer events (S Pen / finger) ---
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (pinching) return;
            drawing = true;
            const p = screenToCanvas(e.clientX, e.clientY);
            lx = p.x; ly = p.y;
            // Save undo state
            history.push(canvas.toDataURL('image/png'));
            if (history.length > 30) history.shift();
        });

        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            if (!drawing || pinching) return;
            const p = screenToCanvas(e.clientX, e.clientY);
            const pressure = e.pressure || 0.5;
            const size = 2 + pressure * 6;

            // Draw locally
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Buffer for network send
            bufferStroke(lx / SIZE, ly / SIZE, p.x / SIZE, p.y / SIZE, size / SIZE);

            lx = p.x;
            ly = p.y;
        });

        canvas.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (!drawing) return;
            drawing = false;
            flushStrokes();
        });

        canvas.addEventListener('pointerleave', () => {
            if (drawing) { drawing = false; flushStrokes(); }
        });

        // --- Pinch to zoom ---
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                pinching = true;
                drawing = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchDist = Math.hypot(dx, dy);
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && pinching) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const d = Math.hypot(dx, dy);
                scale = Math.max(0.4, Math.min(4, scale * (d / pinchDist)));
                pinchDist = d;
                fitCanvas();
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) pinching = false;
        });

        // Scroll wheel zoom (desktop)
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = Math.max(0.4, Math.min(4, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
            fitCanvas();
        }, { passive: false });

        // --- Clear ---
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, SIZE, SIZE);
            history = [];
            send({ type: 'clear' });
        });

        // --- Undo ---
        document.getElementById('undoBtn').addEventListener('click', () => {
            if (history.length === 0) return;
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, SIZE, SIZE);
                ctx.drawImage(img, 0, 0);
                send({ type: 'undo', img: history[history.length] }); // signal viewer
                // Send full sync
                send({ type: 'sync', canvas: canvas.toDataURL('image/jpeg', 0.6).split(',')[1] });
            };
            img.src = history.pop();
        });

        // Ctrl+Z
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); document.getElementById('undoBtn').click(); }
        });

        // Prevent default touch
        document.addEventListener('touchmove', (e) => { if (e.touches.length === 1) e.preventDefault(); }, { passive: false });
    })();
    </script>
</body>
</html>
