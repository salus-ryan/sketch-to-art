<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Viewer — Stream Output</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        #sketchCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }
        #aiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #aiCanvas.visible { opacity: 0.85; }
        .status {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            padding: 8px 14px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <canvas id="aiCanvas"></canvas>
    <canvas id="sketchCanvas"></canvas>
    <div class="status" id="status">Waiting for drawer...</div>

    <script>
        const sketchCanvas = document.getElementById('sketchCanvas');
        const aiCanvas = document.getElementById('aiCanvas');
        const ctx = sketchCanvas.getContext('2d');
        const actx = aiCanvas.getContext('2d');

        // Match the drawer's fixed square canvas
        const CANVAS_SIZE = 1024;
        sketchCanvas.width = CANVAS_SIZE;
        sketchCanvas.height = CANVAS_SIZE;
        aiCanvas.width = CANVAS_SIZE;
        aiCanvas.height = CANVAS_SIZE;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        function applyTransform() {
            // Fit square canvas within viewport, centered
            const s = Math.min(window.innerWidth, window.innerHeight) / CANVAS_SIZE;
            const cx = (window.innerWidth - CANVAS_SIZE * s) / 2;
            const cy = (window.innerHeight - CANVAS_SIZE * s) / 2;
            const transform = `translate(${cx}px, ${cy}px) scale(${s})`;
            sketchCanvas.style.transform = transform;
            aiCanvas.style.transform = transform;
            sketchCanvas.style.transformOrigin = '0 0';
            aiCanvas.style.transformOrigin = '0 0';
        }
        applyTransform();
        window.addEventListener('resize', applyTransform);

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws/viewer`);

            ws.onopen = () => {
                document.getElementById('status').textContent = 'Connected — draw on your phone';
            };
            ws.onclose = () => { setTimeout(connectWS, 3000); };
            ws.onerror = () => ws.close();

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'stroke') {
                    // Draw the stroke mirrored from the phone (both use 1024x1024)
                    ctx.beginPath();
                    ctx.moveTo(data.x1 * CANVAS_SIZE, data.y1 * CANVAS_SIZE);
                    ctx.lineTo(data.x2 * CANVAS_SIZE, data.y2 * CANVAS_SIZE);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = data.size * CANVAS_SIZE;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();

                    // Hide AI overlay while new strokes come in
                    aiCanvas.classList.remove('visible');
                    document.getElementById('status').textContent = 'Drawing...';
                }

                else if (data.type === 'sync') {
                    // Full canvas sync — replaces everything
                    const syncImg = new Image();
                    syncImg.onload = () => {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        ctx.drawImage(syncImg, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    };
                    syncImg.src = 'data:image/jpeg;base64,' + data.canvas;
                }

                else if (data.type === 'clear') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    actx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    aiCanvas.classList.remove('visible');
                    document.getElementById('status').textContent = 'Cleared';
                }

                else if (data.type === 'result' && data.image) {
                    const img = new Image();
                    img.onload = () => {
                        actx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        actx.drawImage(img, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        aiCanvas.classList.add('visible');
                        document.getElementById('status').textContent = `AI: ${data.time}s`;
                    };
                    img.src = 'data:image/webp;base64,' + data.image;
                }
            };
        }

        connectWS();
    </script>
</body>
</html>
