<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100%; width: 100%; overflow: hidden; }
        #c { position: absolute; }
        .dot {
            position: fixed; top: 12px; right: 12px;
            width: 10px; height: 10px; border-radius: 50%;
            background: #333; z-index: 99;
        }
        .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="dot" id="dot"></div>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const dot = document.getElementById('dot');

        const SIZE = 1024;
        canvas.width = SIZE;
        canvas.height = SIZE;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, SIZE, SIZE);

        function fit() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            // Fit inside viewport (contain mode for viewer)
            const s = Math.min(vw / SIZE, vh / SIZE);
            const left = (vw - SIZE * s) / 2;
            const top = (vh - SIZE * s) / 2;
            canvas.style.transform = `translate(${left}px, ${top}px) scale(${s})`;
            canvas.style.transformOrigin = '0 0';
        }
        fit();
        window.addEventListener('resize', fit);

        function drawStroke(x1, y1, x2, y2, w) {
            ctx.beginPath();
            ctx.moveTo(x1 * SIZE, y1 * SIZE);
            ctx.lineTo(x2 * SIZE, y2 * SIZE);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = w * SIZE;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws/viewer`);

            ws.onopen = () => { dot.classList.add('ok'); };
            ws.onclose = () => { dot.classList.remove('ok'); setTimeout(connect, 2000); };
            ws.onerror = () => ws.close();

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'strokes') {
                    // Batched strokes — draw all at once
                    for (const s of data.data) {
                        drawStroke(s.x1, s.y1, s.x2, s.y2, s.w);
                    }
                }

                else if (data.type === 'stroke') {
                    drawStroke(data.x1, data.y1, data.x2, data.y2, data.size);
                }

                else if (data.type === 'sync') {
                    const img = new Image();
                    img.onload = () => {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, SIZE, SIZE);
                        ctx.drawImage(img, 0, 0, SIZE, SIZE);
                    };
                    img.src = 'data:image/jpeg;base64,' + data.canvas;
                }

                else if (data.type === 'clear') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, SIZE, SIZE);
                }
            };
        }

        connect();
    })();
    </script>
</body>
</html>
